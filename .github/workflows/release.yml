name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Check version matches tag
        run: |
          v=$(sed -n 's/.*current = "\(.*\)".*/\1/p' Sources/PierCore/Version.swift)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Version.swift ($v) != tag ($GITHUB_REF_NAME)"; exit 1; }
      - name: Build app + zip
        run: packaging/build-app.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "pier $GITHUB_REF_NAME" --generate-notes
